name: Refresh blog

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site on Vercel so new Medium posts appear
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set yet, so there is nothing to trigger."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
